paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login success
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register brand or influencer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                fullName:
                  type: string
                role:
                  type: string
                  enum: [brand, influencer]
      responses:
        '201':
          description: Registered
        '400':
          $ref: '#/components/responses/DuplicateEmail'

  /campaigns/open:
    get:
      tags: [Campaigns]
      summary: Public list of recruiting (upComming) campaigns
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 6
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paginated open campaigns

  /support:
    post:
      tags: [Support]
      summary: Submit a support ticket (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name:
                  type: string
                email:
                  type: string
                topic:
                  type: string
                  enum: [Campaign, Payment, Withdraw, Account, Other]
                message:
                  type: string
      responses:
        '201':
          description: Ticket created
    get:
      tags: [Support]
      summary: List support tickets (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ticket list
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications:
    get:
      tags: [Notifications]
      summary: My notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notification list

  /plans:
    get:
      tags: [Plans]
      summary: Public active subscription plans
      responses:
        '200':
          description: Plans list

  /ratings/user/{userId}:
    get:
      tags: [Ratings]
      summary: Public ratings for a user
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ratings + average
